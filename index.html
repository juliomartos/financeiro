<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Controle Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#181818;--surface2:#222;
  --border:#2a2a2a;--border2:#333;
  --text:#f0ede8;--muted:#888;--dim:#444;
  --green:#4ade80;--green-dim:#1a3d2b;
  --red:#f87171;--red-dim:#3d1a1a;
  --amber:#fbbf24;--amber-dim:#3d2e0a;
  --blue:#60a5fa;--blue-dim:#0f1f3d;
  --purple:#c084fc;--purple-dim:#2a1040;
  --accent:#4ade80;
  --r:12px;--rs:8px;
  --fd:'Syne',sans-serif;--fm:'DM Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fd)}
#root{height:100%}
.app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding-bottom:72px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hd{padding:20px 20px 0;position:sticky;top:0;background:var(--bg);z-index:10}
.hd-row{display:flex;justify-content:space-between;align-items:center}
.hd-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wnav{display:flex;align-items:center;gap:8px}
.wbtn{background:none;border:1px solid var(--border2);color:var(--text);width:28px;height:28px;border-radius:var(--rs);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.wbtn:disabled{opacity:.3;cursor:default}
.wlabel{font-size:11px;color:var(--muted);font-family:var(--fm);min-width:106px;text-align:center}
.bal{padding:16px 20px 20px}
.bal-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bal-val{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bal-val.pos{color:var(--green)}.bal-val.neg{color:var(--red)}.bal-val.zer{color:var(--text)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sc-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sc-val{font-size:20px;font-weight:700;font-family:var(--fm)}
.sc-val.inc{color:var(--green)}.sc-val.exp{color:var(--red)}
.sec{padding:0 20px;margin-bottom:20px}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;position:relative;overflow:hidden}
.tx-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-ico.inc{background:var(--green-dim)}.tx-ico.exp{background:var(--red-dim)}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-cat{font-size:11px;color:var(--muted);margin-top:2px}
.tx-amt{font-size:15px;font-weight:700;font-family:var(--fm);flex-shrink:0}
.tx-amt.inc{color:var(--green)}.tx-amt.exp{color:var(--red)}
.tx-del{position:absolute;right:0;top:0;bottom:0;width:0;background:var(--red-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:width .2s;overflow:hidden;font-size:18px;border-left:1px solid var(--border)}
.tx:hover .tx-del{width:48px}
.ci{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.ci-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ci-name{font-size:15px;font-weight:700}
.ci-lim{font-size:11px;color:var(--muted);font-family:var(--fm);margin-top:2px}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.badge.visa{background:var(--blue-dim);color:var(--blue)}
.badge.master{background:var(--amber-dim);color:var(--amber)}
.badge.elo{background:var(--purple-dim);color:var(--purple)}
.badge.other{background:var(--surface2);color:var(--muted)}
.pbar{background:var(--border);border-radius:20px;height:6px;overflow:hidden;margin-bottom:6px}
.pfill{height:100%;border-radius:20px;transition:width .4s}
.pfill.safe{background:var(--green)}.pfill.warn{background:var(--amber)}.pfill.danger{background:var(--red)}
.ci-stats{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--fm)}
.del-btn{font-size:11px;color:var(--red);cursor:pointer;background:none;border:none;margin-top:8px;font-weight:600;font-family:var(--fd)}
.gi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.gi-hd{display:flex;justify-content:space-between;margin-bottom:8px}
.gi-name{font-size:14px;font-weight:700}
.gi-pct{font-size:13px;font-weight:700;font-family:var(--fm);color:var(--accent)}
.gi-amounts{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--fm);margin-top:6px}
.gi-actions{display:flex;gap:12px;margin-top:8px}
.add-btn{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;font-weight:600;font-family:var(--fd)}
.bnav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20}
.nb{flex:1;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:none;color:var(--muted);font-family:var(--fd);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nb.on{color:var(--accent)}
.ni{font-size:20px}
.fab{position:absolute;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#000;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(74,222,128,.35);z-index:30}
.fab:active{transform:scale(.93)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 48px;width:100%;max-width:430px;border-top:1px solid var(--border2)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:20px}
.fg{margin-bottom:14px}
.fl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.fi{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--fd);font-size:15px;padding:10px 12px;outline:none;transition:border .15s}
.fi:focus{border-color:var(--accent)}
.fi option{background:var(--surface)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ttog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tbtn{padding:10px;border-radius:var(--rs);border:1px solid var(--border2);background:none;color:var(--muted);font-family:var(--fd);font-size:13px;font-weight:600;cursor:pointer}
.tbtn.inc.on{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.tbtn.exp.on{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.sbtn{width:100%;padding:14px;border-radius:var(--r);background:var(--accent);border:none;color:#000;font-family:var(--fd);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.cbtn{width:100%;padding:10px;border-radius:var(--r);background:none;border:1px solid var(--border2);color:var(--muted);font-family:var(--fd);font-size:14px;cursor:pointer;margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty-ico{font-size:40px;margin-bottom:12px;opacity:.5}
.empty-txt{font-size:13px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 18px;font-size:13px;font-weight:600;z-index:100;transition:opacity .3s;white-space:nowrap;pointer-events:none}
.toast.off{opacity:0}
.actbtn{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--fd);font-size:12px;font-weight:600;padding:7px 12px;cursor:pointer}
.pills{display:flex;gap:8px;padding:12px 20px 4px}
.pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:var(--fd);font-size:12px;font-weight:600;cursor:pointer}
.pill.on{background:var(--accent);border-color:var(--accent);color:#000}
.pin-wrap{height:100vh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;background:var(--bg)}
.pin-logo{font-size:44px;margin-bottom:10px}
.pin-title{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:40px;text-align:center;line-height:1.5}
.pin-dots{display:flex;gap:16px;margin-bottom:40px}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);transition:all .15s}
.pdot.fill{background:var(--accent);border-color:var(--accent)}
.pdot.err{background:var(--red);border-color:var(--red)}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px}
.pkey{height:64px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--fd);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pkey:active{background:var(--surface2);transform:scale(.95)}
.pkey.kdel{font-size:18px;color:var(--muted)}
.pkey.kempty{border:none;background:none;cursor:default;pointer-events:none}
.pin-err{font-size:13px;color:var(--red);margin-top:16px;min-height:20px;font-weight:600;text-align:center}
.pin-reset{margin-top:28px;font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;font-family:var(--fd);text-decoration:underline}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
'use strict';
const {useState, useCallback, useRef} = React;
const E = React.createElement;

const PIN_KEY  = 'fin_pin';
const SES_KEY  = 'fin_ses';
const CATS_IN  = ['Salário','Freelance','Investimentos','Presente','Outros'];
const CATS_EX  = ['Alimentação','Transporte','Moradia','Saúde','Lazer','Roupas','Educação','Assinaturas','Cartão','Outros'];
const EMOJIS   = {
  'Alimentação':'🍔','Transporte':'🚌','Moradia':'🏠','Saúde':'💊',
  'Lazer':'🎮','Roupas':'👕','Educação':'📚','Assinaturas':'📱',
  'Cartão':'💳','Salário':'💰','Freelance':'💻','Investimentos':'📈',
  'Presente':'🎁','Outros':'📦'
};

function fmt(v) {
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
}
function fmtShort(v) {
  const abs = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (abs >= 1000) return sign + 'R$' + (abs / 1000).toFixed(1) + 'k';
  return fmt(v);
}
function hashPin(pin) {
  let h = 0;
  for (let i = 0; i < pin.length; i++) { h = ((h << 5) - h) + pin.charCodeAt(i); h |= 0; }
  return h.toString(36);
}
function weekBounds(offset) {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - dow + offset * 7);
  mon.setHours(0,0,0,0);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  sun.setHours(23,59,59,999);
  const f = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return {mon, sun, label: f(mon) + ' \u2013 ' + f(sun)};
}
function useLS(key, def) {
  const [val, setVal] = useState(function() {
    try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : def; }
    catch(ex) { return def; }
  });
  const set = useCallback(function(updater) {
    setVal(function(prev) {
      var next = typeof updater === 'function' ? updater(prev) : updater;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch(ex) {}
      return next;
    });
  }, [key]);
  return [val, set];
}

/* Toast */
function Toast(props) {
  return E('div', {className: 'toast' + (props.show ? '' : ' off')}, props.msg);
}

/* PIN Screen */
function PinScreen(props) {
  var storedHash = useRef(localStorage.getItem(PIN_KEY)).current;
  var isSetup = !storedHash;
  var stageState = useState(isSetup ? 'set' : 'enter');
  var stage = stageState[0]; var setStage = stageState[1];
  var pinState = useState('');
  var pin = pinState[0]; var setPin = pinState[1];
  var firstState = useState('');
  var firstPin = firstState[0]; var setFirst = firstState[1];
  var errState = useState('');
  var errMsg = errState[0]; var setErrMsg = errState[1];
  var shakeState = useState(false);
  var shake = shakeState[0]; var setShake = shakeState[1];

  function doShake(msg) {
    setErrMsg(msg); setShake(true); setPin('');
    setTimeout(function() { setShake(false); }, 500);
  }
  function handle(full) {
    if (stage === 'set') {
      setFirst(full); setPin(''); setStage('confirm'); setErrMsg('');
    } else if (stage === 'confirm') {
      if (full === firstPin) {
        localStorage.setItem(PIN_KEY, hashPin(full));
        sessionStorage.setItem(SES_KEY, '1');
        props.onUnlock();
      } else {
        doShake('PINs diferentes. Tente novamente.');
        setStage('set'); setFirst('');
      }
    } else {
      if (hashPin(full) === storedHash) {
        sessionStorage.setItem(SES_KEY, '1');
        props.onUnlock();
      } else {
        doShake('PIN incorreto');
      }
    }
  }
  function press(d) {
    if (pin.length >= 4) return;
    var next = pin + d;
    setPin(next);
    if (next.length === 4) setTimeout(function() { handle(next); }, 80);
  }
  function del() { setPin(function(p) { return p.slice(0,-1); }); setErrMsg(''); }
  function resetPin() {
    var entered = prompt('Digite o PIN atual para redefinir:');
    if (!entered) return;
    if (hashPin(entered) === storedHash) {
      localStorage.removeItem(PIN_KEY);
      window.location.reload();
    } else { alert('PIN incorreto.'); }
  }

  var sub = stage === 'set'
    ? 'Crie um PIN de 4 dígitos para proteger seu app'
    : stage === 'confirm'
    ? 'Repita o PIN para confirmar'
    : 'Acesso protegido por PIN';

  var keys = ['1','2','3','4','5','6','7','8','9','','0','\u232b'];

  return E('div', {className:'pin-wrap'},
    E('div', {className:'pin-logo'}, '\uD83D\uDCB0'),
    E('div', {className:'pin-title'}, 'Controle Financeiro'),
    E('div', {className:'pin-sub'}, sub),
    E('div', {className:'pin-dots' + (shake ? ' shake' : '')},
      [0,1,2,3].map(function(i) {
        return E('div', {key:i, className:'pdot' + (pin.length > i ? (errMsg ? ' err' : ' fill') : '')});
      })
    ),
    E('div', {className:'pin-pad'},
      keys.map(function(k, i) {
        if (k === '')   return E('div',    {key:i, className:'pkey kempty'});
        if (k === '\u232b') return E('button', {key:i, className:'pkey kdel', onClick:del}, k);
        return E('button', {key:i, className:'pkey', onClick:function() { press(k); }}, k);
      })
    ),
    E('div', {className:'pin-err'}, errMsg),
    stage === 'enter' && E('button', {className:'pin-reset', onClick:resetPin}, 'Esqueci meu PIN')
  );
}

/* Modals */
function AddTxModal(props) {
  var typeS = useState('expense'); var type = typeS[0]; var setType = typeS[1];
  var descS = useState(''); var desc = descS[0]; var setDesc = descS[1];
  var amtS  = useState(''); var amount = amtS[0]; var setAmount = amtS[1];
  var catS  = useState(''); var cat = catS[0]; var setCat = catS[1];
  var cidS  = useState(''); var cardId = cidS[0]; var setCardId = cidS[1];
  var cats  = type === 'income' ? CATS_IN : CATS_EX;

  function submit() {
    var v = parseFloat(amount.replace(',','.'));
    if (!desc.trim() || isNaN(v) || v <= 0) return;
    props.onSave({id:Date.now(), type:type, desc:desc.trim(), amount:v,
                  cat:cat||cats[0], cardId:cardId||null, date:new Date().toISOString()});
    props.onClose();
  }
  function stopProp(ev) { ev.stopPropagation(); }

  return E('div', {className:'ov', onClick:props.onClose},
    E('div', {className:'modal', onClick:stopProp},
      E('div', {className:'modal-title'}, 'Nova Transação'),
      E('div', {className:'ttog'},
        E('button', {className:'tbtn inc' + (type==='income'?' on':''), onClick:function(){setType('income');}},  '+ Receita'),
        E('button', {className:'tbtn exp' + (type==='expense'?' on':''), onClick:function(){setType('expense');}}, '\u2212 Despesa')
      ),
      E('div', {className:'fg'},
        E('label', {className:'fl'}, 'Descri\u00e7\u00e3o'),
        E('input', {className:'fi', placeholder:'Ex: Mercado, Sal\u00e1rio\u2026', value:desc, onChange:function(ev){setDesc(ev.target.value);}})
      ),
      E('div', {className:'frow'},
        E('div', {className:'fg'},
          E('label', {className:'fl'}, 'Valor (R$)'),
          E('input', {className:'fi', type:'number', inputMode:'decimal', placeholder:'0,00', value:amount, onChange:function(ev){setAmount(ev.target.value);}})
        ),
        E('div', {className:'fg'},
          E('label', {className:'fl'}, 'Categoria'),
          E('select', {className:'fi', value:cat, onChange:function(ev){setCat(ev.target.value);}},
            cats.map(function(c) { return E('option',{key:c,value:c},c); })
          )
        )
      ),
      type === 'expense' && props.cards.length > 0 &&
        E('div', {className:'fg'},
          E('label', {className:'fl'}, 'Cart\u00e3o (opcional)'),
          E('select', {className:'fi', value:cardId, onChange:function(ev){setCardId(ev.target.value);}},
            E('option', {value:''}, 'Sem cart\u00e3o'),
            props.cards.map(function(c) { return E('option',{key:c.id,value:String(c.id)},c.name); })
          )
        ),
      E('button', {className:'sbtn', onClick:submit}, 'Salvar'),
      E('button', {className:'cbtn', onClick:props.onClose}, 'Cancelar')
    )
  );
}

function AddCardModal(props) {
  var nameS  = useState(''); var name = nameS[0]; var setName = nameS[1];
  var limS   = useState(''); var limit = limS[0]; var setLimit = limS[1];
  var bandS  = useState('visa'); var band = bandS[0]; var setBand = bandS[1];

  function submit() {
    var l = parseFloat(limit.replace(',','.'));
    if (!name.trim() || isNaN(l) || l <= 0) return;
    props.onSave({id:Date.now(), name:name.trim(), limit:l, band:band});
    props.onClose();
  }
  function stopProp(ev) { ev.stopPropagation(); }

  return E('div', {className:'ov', onClick:props.onClose},
    E('div', {className:'modal', onClick:stopProp},
      E('div', {className:'modal-title'}, 'Novo Cart\u00e3o'),
      E('div', {className:'fg'},
        E('label', {className:'fl'}, 'Nome do Cart\u00e3o'),
        E('input', {className:'fi', placeholder:'Ex: Nubank, Inter\u2026', value:name, onChange:function(ev){setName(ev.target.value);}})
      ),
      E('div', {className:'frow'},
        E('div', {className:'fg'},
          E('label', {className:'fl'}, 'Limite (R$)'),
          E('input', {className:'fi', type:'number', inputMode:'decimal', placeholder:'0,00', value:limit, onChange:function(ev){setLimit(ev.target.value);}})
        ),
        E('div', {className:'fg'},
          E('label', {className:'fl'}, 'Bandeira'),
          E('select', {className:'fi', value:band, onChange:function(ev){setBand(ev.target.value);}},
            ['visa','master','elo','other'].map(function(b) {
              return E('option',{key:b,value:b}, b.charAt(0).toUpperCase()+b.slice(1));
            })
          )
        )
      ),
      E('button', {className:'sbtn', onClick:submit}, 'Salvar'),
      E('button', {className:'cbtn', onClick:props.onClose}, 'Cancelar')
    )
  );
}

function AddGoalModal(props) {
  var nameS   = useState(''); var name = nameS[0]; var setName = nameS[1];
  var targS   = useState(''); var target = targS[0]; var setTarget = targS[1];
  var savedS  = useState(''); var saved = savedS[0]; var setSaved = savedS[1];
  var emojiS  = useState('\uD83C\uDFAF'); var emoji = emojiS[0]; var setEmoji = emojiS[1];
  var emojis  = ['\uD83C\uDFAF','\uD83C\uDFE0','\u2708\uFE0F','\uD83D\uDCF1','\uD83D\uDE97','\uD83D\uDC76','\uD83D\uDC8D','\uD83C\uDF93','\uD83D\uDCBB','\uD83C\uDFCB\uFE0F','\uD83C\uDF34','\uD83D\uDCB0'];

  function submit() {
    var t = parseFloat(target.replace(',','.'));
    var s = parseFloat((saved||'0').replace(',','.'));
    if (!name.trim() || isNaN(t) || t <= 0) return;
    props.onSave({id:Date.now(), name:name.trim(), target:t, saved:isNaN(s)?0:s, emoji:emoji});
    props.onClose();
  }
  function stopProp(ev) { ev.stopPropagation(); }

  return E('div', {className:'ov', onClick:props.onClose},
    E('div', {className:'modal', onClick:stopProp},
      E('div', {className:'modal-title'}, 'Nova Meta'),
      E('div', {className:'fg'},
        E('label', {className:'fl'}, '\u00cdcone'),
        E('div', {style:{display:'flex',flexWrap:'wrap',gap:'8px'}},
          emojis.map(function(em) {
            return E('button', {
              key:em, onClick:function(){setEmoji(em);},
              style:{fontSize:'22px', background:emoji===em?'var(--surface2)':'none',
                     border:'1px solid '+(emoji===em?'var(--accent)':'var(--border)'),
                     borderRadius:'8px', padding:'4px 8px', cursor:'pointer'}
            }, em);
          })
        )
      ),
      E('div', {className:'fg'},
        E('label', {className:'fl'}, 'Nome da Meta'),
        E('input', {className:'fi', placeholder:'Ex: Viagem, Notebook\u2026', value:name, onChange:function(ev){setName(ev.target.value);}})
      ),
      E('div', {className:'frow'},
        E('div', {className:'fg'},
          E('label', {className:'fl'}, 'Objetivo (R$)'),
          E('input', {className:'fi', type:'number', inputMode:'decimal', placeholder:'0,00', value:target, onChange:function(ev){setTarget(ev.target.value);}})
        ),
        E('div', {className:'fg'},
          E('label', {className:'fl'}, 'J\u00e1 guardado'),
          E('input', {className:'fi', type:'number', inputMode:'decimal', placeholder:'0,00', value:saved, onChange:function(ev){setSaved(ev.target.value);}})
        )
      ),
      E('button', {className:'sbtn', onClick:submit}, 'Salvar'),
      E('button', {className:'cbtn', onClick:props.onClose}, 'Cancelar')
    )
  );
}

function AddToGoalModal(props) {
  var amtS = useState(''); var amount = amtS[0]; var setAmount = amtS[1];
  function submit() {
    var v = parseFloat(amount.replace(',','.'));
    if (isNaN(v) || v <= 0) return;
    props.onAdd(props.goal.id, v);
    props.onClose();
  }
  function stopProp(ev) { ev.stopPropagation(); }
  return E('div', {className:'ov', onClick:props.onClose},
    E('div', {className:'modal', onClick:stopProp},
      E('div', {className:'modal-title'}, props.goal.emoji + ' ' + props.goal.name),
      E('div', {className:'fg'},
        E('label', {className:'fl'}, 'Valor a adicionar (R$)'),
        E('input', {className:'fi', type:'number', inputMode:'decimal', placeholder:'0,00',
                    autoFocus:true, value:amount, onChange:function(ev){setAmount(ev.target.value);}})
      ),
      E('button', {className:'sbtn', onClick:submit}, 'Adicionar'),
      E('button', {className:'cbtn', onClick:props.onClose}, 'Cancelar')
    )
  );
}

/* Tabs */
function HomeTab(props) {
  var wb = weekBounds(props.weekOffset);
  var weekTxs = props.txs.filter(function(t) {
    var d = new Date(t.date);
    return d >= wb.mon && d <= wb.sun;
  });
  var income  = weekTxs.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  var expense = weekTxs.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
  var balance = income - expense;
  var sorted  = weekTxs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var balCls  = balance > 0 ? 'pos' : balance < 0 ? 'neg' : 'zer';

  return E('div', null,
    E('div', {className:'hd'},
      E('div', {className:'hd-row'},
        E('span', {className:'hd-label'}, 'Semana'),
        E('div', {className:'wnav'},
          E('button', {className:'wbtn', onClick:function(){props.setWeekOffset(function(o){return o-1;});}}, '\u2039'),
          E('span',  {className:'wlabel'}, wb.label),
          E('button', {className:'wbtn', disabled:props.weekOffset===0,
            onClick:function(){props.setWeekOffset(function(o){return Math.min(0,o+1);});}}, '\u203a')
        )
      )
    ),
    E('div', {className:'bal'},
      E('div', {className:'bal-lbl'}, 'Saldo da semana'),
      E('div', {className:'bal-val '+balCls}, fmtShort(balance))
    ),
    E('div', {className:'stats'},
      E('div', {className:'sc'}, E('div',{className:'sc-lbl'},'Entradas'), E('div',{className:'sc-val inc'},fmtShort(income))),
      E('div', {className:'sc'}, E('div',{className:'sc-lbl'},'Sa\u00eddas'),   E('div',{className:'sc-val exp'},fmtShort(expense)))
    ),
    E('div', {className:'sec'},
      E('div', {className:'sec-hd'}, E('span',{className:'sec-title'},'Transa\u00e7\u00f5es')),
      sorted.length === 0
        ? E('div',{className:'empty'}, E('div',{className:'empty-ico'},'\uD83D\uDCCB'), E('div',{className:'empty-txt'},'Nenhuma transa\u00e7\u00e3o esta semana'))
        : sorted.map(function(t) { return E(TxRow,{key:t.id,tx:t}); })
    )
  );
}

function TxRow(props) {
  var t = props.tx;
  var cls = t.type === 'income' ? 'inc' : 'exp';
  return E('div', {className:'tx'},
    E('div', {className:'tx-ico '+cls}, EMOJIS[t.cat]||'\uD83D\uDCB8'),
    E('div', {className:'tx-info'},
      E('div', {className:'tx-desc'}, t.desc),
      E('div', {className:'tx-cat'},  t.cat)
    ),
    E('div', {className:'tx-amt '+cls}, (t.type==='income'?'+':'\u2212')+fmt(t.amount))
  );
}

function CardsTab(props) {
  var modalS = useState(false); var modal = modalS[0]; var setModal = modalS[1];

  function getUsed(cardId) {
    return props.txs
      .filter(function(t){return String(t.cardId)===String(cardId) && t.type==='expense';})
      .reduce(function(s,t){return s+t.amount;},0);
  }
  function delCard(id) {
    props.setCards(function(cs){return cs.filter(function(c){return c.id!==id;});});
    props.showToast('Cart\u00e3o removido');
  }

  return E('div', null,
    E('div', {className:'hd'},
      E('div', {className:'hd-row'},
        E('span', {className:'hd-label'}, 'Cart\u00f5es'),
        E('button', {className:'actbtn', onClick:function(){setModal(true);}}, '+ Adicionar')
      )
    ),
    E('div', {style:{height:'16px'}}),
    E('div', {className:'sec'},
      props.cards.length === 0
        ? E('div',{className:'empty'}, E('div',{className:'empty-ico'},'\uD83D\uDCB3'), E('div',{className:'empty-txt'},'Adicione seus cart\u00f5es de cr\u00e9dito'))
        : props.cards.map(function(card) {
            var used = getUsed(card.id);
            var pct  = Math.min(100, (used/card.limit)*100);
            var cls  = pct < 60 ? 'safe' : pct < 85 ? 'warn' : 'danger';
            return E('div', {key:card.id, className:'ci'},
              E('div', {className:'ci-hd'},
                E('div', null,
                  E('div', {className:'ci-name'}, card.name),
                  E('div', {className:'ci-lim'}, 'Limite: '+fmt(card.limit))
                ),
                E('div', {className:'badge '+card.band}, card.band.toUpperCase())
              ),
              E('div', {className:'pbar'}, E('div',{className:'pfill '+cls, style:{width:pct.toFixed(1)+'%'}})),
              E('div', {className:'ci-stats'},
                E('span', null, 'Usado: '+fmt(used)),
                E('span', null, 'Dispon\u00edvel: '+fmt(Math.max(0,card.limit-used)))
              ),
              E('button', {className:'del-btn', onClick:function(){delCard(card.id);}}, 'Remover cart\u00e3o')
            );
          })
    ),
    modal && E(AddCardModal, {
      onClose:function(){setModal(false);},
      onSave:function(c){props.setCards(function(cs){return cs.concat([c]);});props.showToast('Cart\u00e3o adicionado!');}
    })
  );
}

function GoalsTab(props) {
  var modalS = useState(false); var modal = modalS[0]; var setModal = modalS[1];
  var addToS = useState(null); var addTo = addToS[0]; var setAddTo = addToS[1];

  function delGoal(id) {
    props.setGoals(function(gs){return gs.filter(function(g){return g.id!==id;});});
    props.showToast('Meta removida');
  }
  function addToGoal(id, amount) {
    props.setGoals(function(gs){
      return gs.map(function(g){
        return g.id===id ? Object.assign({},g,{saved:Math.min(g.target,g.saved+amount)}) : g;
      });
    });
    props.showToast('Valor adicionado! \uD83C\uDF89');
  }

  return E('div', null,
    E('div', {className:'hd'},
      E('div', {className:'hd-row'},
        E('span', {className:'hd-label'}, 'Metas'),
        E('button', {className:'actbtn', onClick:function(){setModal(true);}}, '+ Nova Meta')
      )
    ),
    E('div', {style:{height:'16px'}}),
    E('div', {className:'sec'},
      props.goals.length === 0
        ? E('div',{className:'empty'}, E('div',{className:'empty-ico'},'\uD83C\uDFAF'), E('div',{className:'empty-txt'},'Crie metas de economia para alcan\u00e7ar seus sonhos'))
        : props.goals.map(function(g) {
            var pct  = Math.min(100, Math.round((g.saved/g.target)*100));
            var done = pct >= 100;
            var cls  = done ? 'safe' : pct < 80 ? 'safe' : 'warn';
            return E('div', {key:g.id, className:'gi'},
              E('div', {className:'gi-hd'},
                E('div', {style:{display:'flex',alignItems:'center',gap:'8px'}},
                  E('span',null,g.emoji),
                  E('span',{className:'gi-name'},g.name+(done?' \u2705':''))
                ),
                E('span',{className:'gi-pct'},pct+'%')
              ),
              E('div',{className:'pbar'}, E('div',{className:'pfill '+cls, style:{width:pct+'%'}})),
              E('div',{className:'gi-amounts'},
                E('span',null,'Guardado: '+fmt(g.saved)),
                E('span',null,'Meta: '+fmt(g.target))
              ),
              E('div',{className:'gi-actions'},
                !done && E('button',{className:'add-btn', onClick:function(){setAddTo(g);}}, '+ Adicionar'),
                E('button',{className:'del-btn', onClick:function(){delGoal(g.id);}}, 'Remover')
              )
            );
          })
    ),
    modal && E(AddGoalModal, {
      onClose:function(){setModal(false);},
      onSave:function(g){props.setGoals(function(gs){return gs.concat([g]);});props.showToast('Meta criada!');}
    }),
    addTo && E(AddToGoalModal, {goal:addTo, onClose:function(){setAddTo(null);}, onAdd:addToGoal})
  );
}

function HistoryTab(props) {
  var filterS = useState('all'); var filter = filterS[0]; var setFilter = filterS[1];
  var filtered = filter === 'all' ? props.txs : props.txs.filter(function(t){return t.type===filter;});
  var sorted   = filtered.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  function delTx(id) {
    props.setTxs(function(ts){return ts.filter(function(t){return t.id!==id;});});
    props.showToast('Transa\u00e7\u00e3o removida');
  }
  function exportCSV() {
    var all = props.txs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    var rows = [['Data','Tipo','Descri\u00e7\u00e3o','Categoria','Valor']].concat(
      all.map(function(t){
        return [
          new Date(t.date).toLocaleDateString('pt-BR'),
          t.type==='income'?'Receita':'Despesa',
          t.desc, t.cat,
          t.amount.toFixed(2).replace('.',',')
        ];
      })
    );
    var csv  = rows.map(function(r){return r.map(function(v){return '"'+v+'"';}).join(';');}).join('\n');
    var blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href=url; a.download='financeiro.csv'; a.click();
    URL.revokeObjectURL(url);
    props.showToast('CSV exportado!');
  }

  return E('div', null,
    E('div', {className:'hd'},
      E('div', {className:'hd-row'},
        E('span', {className:'hd-label'}, 'Hist\u00f3rico'),
        E('button', {className:'actbtn', onClick:exportCSV}, '\u2193 Exportar CSV')
      )
    ),
    E('div', {className:'pills'},
      ['all','income','expense'].map(function(f){
        return E('button',{key:f, className:'pill'+(filter===f?' on':''), onClick:function(){setFilter(f);}},
          f==='all'?'Tudo':f==='income'?'Receitas':'Despesas'
        );
      })
    ),
    E('div', {className:'sec', style:{marginTop:'12px'}},
      sorted.length === 0
        ? E('div',{className:'empty'}, E('div',{className:'empty-ico'},'\uD83D\uDCCB'), E('div',{className:'empty-txt'},'Nenhuma transa\u00e7\u00e3o'))
        : sorted.map(function(t) {
            var cls = t.type==='income'?'inc':'exp';
            return E('div', {key:t.id, className:'tx', style:{paddingRight:'60px'}},
              E('div',{className:'tx-ico '+cls}, EMOJIS[t.cat]||'\uD83D\uDCB8'),
              E('div',{className:'tx-info'},
                E('div',{className:'tx-desc'}, t.desc),
                E('div',{className:'tx-cat'}, t.cat+' \u00b7 '+new Date(t.date).toLocaleDateString('pt-BR'))
              ),
              E('div',{className:'tx-amt '+cls}, (t.type==='income'?'+':'\u2212')+fmt(t.amount)),
              E('div',{className:'tx-del', onClick:function(){delTx(t.id);}}, '\uD83D\uDDD1')
            );
          })
    )
  );
}

/* Main App — all hooks here, no conditional returns before hooks */
function MainApp() {
  var txsS    = useLS('fin_txs',   []); var txs    = txsS[0]; var setTxs    = txsS[1];
  var cardsS  = useLS('fin_cards', []); var cards  = cardsS[0]; var setCards  = cardsS[1];
  var goalsS  = useLS('fin_goals', []); var goals  = goalsS[0]; var setGoals  = goalsS[1];
  var tabS    = useState('home');       var tab    = tabS[0]; var setTab    = tabS[1];
  var wkS     = useState(0);            var weekOff= wkS[0];  var setWkOff  = wkS[1];
  var addS    = useState(false);        var addMod = addS[0]; var setAddMod = addS[1];
  var toastS  = useState({msg:'',show:false}); var toast = toastS[0]; var setToast = toastS[1];

  function showToast(msg) {
    setToast({msg:msg,show:true});
    setTimeout(function(){setToast(function(t){return Object.assign({},t,{show:false});});}, 2200);
  }
  function saveTx(tx) {
    setTxs(function(ts){return ts.concat([tx]);});
    showToast(tx.type==='income' ? 'Receita adicionada! \uD83D\uDC9A' : 'Despesa registrada!');
  }

  var TABS = [
    {id:'home',    icon:'\uD83C\uDFE0', label:'Semana'},
    {id:'cards',   icon:'\uD83D\uDCB3', label:'Cart\u00f5es'},
    {id:'goals',   icon:'\uD83C\uDFAF', label:'Metas'},
    {id:'history', icon:'\uD83D\uDCCB', label:'Hist\u00f3rico'},
  ];

  var showFab = tab === 'home' || tab === 'history';

  return E('div', {className:'app'},
    E('div', {className:'scroll'},
      tab==='home'    && E(HomeTab,    {txs:txs, weekOffset:weekOff, setWeekOffset:setWkOff}),
      tab==='cards'   && E(CardsTab,   {cards:cards, setCards:setCards, txs:txs, showToast:showToast}),
      tab==='goals'   && E(GoalsTab,   {goals:goals, setGoals:setGoals, showToast:showToast}),
      tab==='history' && E(HistoryTab, {txs:txs, setTxs:setTxs, showToast:showToast})
    ),
    showFab && E('button', {className:'fab', onClick:function(){setAddMod(true);}}, '+'),
    E('nav', {className:'bnav'},
      TABS.map(function(t) {
        return E('button',{key:t.id, className:'nb'+(tab===t.id?' on':''), onClick:function(){setTab(t.id);}},
          E('span',{className:'ni'},t.icon),
          t.label
        );
      })
    ),
    addMod && E(AddTxModal, {onClose:function(){setAddMod(false);}, onSave:saveTx, cards:cards}),
    E(Toast, {msg:toast.msg, show:toast.show})
  );
}

/* Root — PIN gate, then MainApp */
function App() {
  var unlS = useState(function(){return !!sessionStorage.getItem(SES_KEY);});
  var unlocked = unlS[0]; var setUnlocked = unlS[1];
  if (!unlocked) return E(PinScreen, {onUnlock:function(){setUnlocked(true);}});
  return E(MainApp, null);
}

ReactDOM.createRoot(document.getElementById('root')).render(E(App, null));
</script>
</body>
</html>
