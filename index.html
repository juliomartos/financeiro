<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Financeiro"/>
<title>Controle Financeiro</title>
<link id="pwa-manifest" rel="manifest"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#181818;--surface2:#222;
  --border:#2a2a2a;--border2:#333;
  --text:#f0ede8;--muted:#888;--dim:#444;
  --green:#4ade80;--green-dim:#1a3d2b;
  --red:#f87171;--red-dim:#3d1a1a;
  --amber:#fbbf24;--amber-dim:#3d2e0a;
  --blue:#60a5fa;--blue-dim:#0f1f3d;
  --purple:#c084fc;--purple-dim:#2a1040;
  --accent:#4ade80;
  --r:12px;--rs:8px;
  --fd:'Syne',sans-serif;--fm:'DM Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fd)}
#root{height:100%}
.app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding-bottom:72px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hd{padding:20px 20px 0;position:sticky;top:0;background:var(--bg);z-index:10}
.hd-row{display:flex;justify-content:space-between;align-items:center}
.hd-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wnav{display:flex;align-items:center;gap:8px}
.wbtn{background:none;border:1px solid var(--border2);color:var(--text);width:28px;height:28px;border-radius:var(--rs);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.wbtn:disabled{opacity:.3;cursor:default}
.wlabel{font-size:15px;font-weight:700;color:var(--text);font-family:var(--fd);min-width:130px;text-align:center}
/* filter mode pills row */
.fmode{display:flex;gap:6px;padding:10px 20px 0;overflow-x:auto;scrollbar-width:none}
.fmode::-webkit-scrollbar{display:none}
.fmpill{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:var(--fd);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.fmpill.on{background:var(--accent);border-color:var(--accent);color:#000}
/* date picker row */
.datepick{display:flex;align-items:center;gap:8px;padding:8px 20px 0}
.datepick input[type=date]{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--fm);font-size:12px;padding:6px 10px;outline:none;flex:1}
.datepick input[type=date]:focus{border-color:var(--accent)}
.bal{padding:16px 20px 20px}
.bal-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bal-val{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bal-val.pos{color:var(--green)}.bal-val.neg{color:var(--red)}.bal-val.zer{color:var(--text)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sc-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sc-val{font-size:20px;font-weight:700;font-family:var(--fm)}
.sc-val.inc{color:var(--green)}.sc-val.exp{color:var(--red)}
.sec{padding:0 20px;margin-bottom:20px}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;position:relative;overflow:hidden}
.tx-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-ico.inc{background:var(--green-dim)}.tx-ico.exp{background:var(--red-dim)}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-cat{font-size:11px;color:var(--muted);margin-top:2px}
.tx-amt{font-size:15px;font-weight:700;font-family:var(--fm);flex-shrink:0}
.tx-amt.inc{color:var(--green)}.tx-amt.exp{color:var(--red)}
.tx-del{position:absolute;right:0;top:0;bottom:0;width:0;background:var(--red-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:width .2s;overflow:hidden;font-size:18px;border-left:1px solid var(--border)}
.tx:hover .tx-del{width:48px}
.del-btn{font-size:11px;color:var(--red);cursor:pointer;background:none;border:none;margin-top:8px;font-weight:600;font-family:var(--fd)}
.gi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.gi-hd{display:flex;justify-content:space-between;margin-bottom:8px}
.gi-name{font-size:14px;font-weight:700}
.gi-pct{font-size:13px;font-weight:700;font-family:var(--fm);color:var(--accent)}
.gi-amounts{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--fm);margin-top:6px}
.gi-actions{display:flex;gap:12px;margin-top:8px}
.add-btn{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;font-weight:600;font-family:var(--fd)}
.bnav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20}
.nb{flex:1;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:none;color:var(--muted);font-family:var(--fd);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nb.on{color:var(--accent)}
.ni{font-size:20px}
.fab{position:absolute;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#000;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(74,222,128,.35);z-index:30}
.fab:active{transform:scale(.93)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 48px;width:100%;max-width:430px;border-top:1px solid var(--border2)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:20px}
.fg{margin-bottom:14px}
.fl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.fi{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--fd);font-size:15px;padding:10px 12px;outline:none;transition:border .15s}
.fi:focus{border-color:var(--accent)}
.fi option{background:var(--surface)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ttog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tbtn{padding:10px;border-radius:var(--rs);border:1px solid var(--border2);background:none;color:var(--muted);font-family:var(--fd);font-size:13px;font-weight:600;cursor:pointer}
.tbtn.inc.on{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.tbtn.exp.on{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.sbtn{width:100%;padding:14px;border-radius:var(--r);background:var(--accent);border:none;color:#000;font-family:var(--fd);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.cbtn{width:100%;padding:10px;border-radius:var(--r);background:none;border:1px solid var(--border2);color:var(--muted);font-family:var(--fd);font-size:14px;cursor:pointer;margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty-ico{font-size:40px;margin-bottom:12px;opacity:.5}
.empty-txt{font-size:13px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 18px;font-size:13px;font-weight:600;z-index:100;transition:opacity .3s;white-space:nowrap;pointer-events:none}
.toast.off{opacity:0}
.actbtn{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--fd);font-size:12px;font-weight:600;padding:7px 12px;cursor:pointer}
.pills{display:flex;gap:8px;padding:12px 20px 4px}
.pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:var(--fd);font-size:12px;font-weight:600;cursor:pointer}
.pill.on{background:var(--accent);border-color:var(--accent);color:#000}
.pin-wrap{height:100vh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;background:var(--bg)}
.pin-logo{font-size:44px;margin-bottom:10px}
.pin-title{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:40px;text-align:center;line-height:1.5}
.pin-dots{display:flex;gap:16px;margin-bottom:40px}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);transition:all .15s}
.pdot.fill{background:var(--accent);border-color:var(--accent)}
.pdot.err{background:var(--red);border-color:var(--red)}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px}
.pkey{height:64px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--fd);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pkey:active{background:var(--surface2);transform:scale(.95)}
.pkey.kdel{font-size:18px;color:var(--muted)}
.pkey.kempty{border:none;background:none;cursor:default;pointer-events:none}
.pin-err{font-size:13px;color:var(--red);margin-top:16px;min-height:20px;font-weight:600;text-align:center}
.pin-reset{margin-top:28px;font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;font-family:var(--fd);text-decoration:underline}
.inst-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;font-family:var(--fm);background:var(--amber-dim);color:var(--amber);border-radius:6px;padding:2px 7px;margin-top:3px;letter-spacing:.03em}
.inst-tag.paid{background:var(--green-dim);color:var(--green)}
.month-hd{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.tx.future{opacity:.55;border-style:dashed}
.inst-toggle{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;user-select:none}
.inst-toggle input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.inst-toggle span{font-size:13px;color:var(--muted);font-weight:600}
/* PWA install banner */
.pwa-banner{display:flex;align-items:center;gap:12px;margin:0 20px 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.pwa-banner-txt{flex:1;font-size:13px;line-height:1.4}
.pwa-banner-title{font-weight:700;color:var(--text);margin-bottom:2px}
.pwa-banner-sub{font-size:11px;color:var(--muted)}
.pwa-install-btn{background:var(--accent);border:none;color:#000;font-family:var(--fd);font-size:12px;font-weight:700;padding:8px 14px;border-radius:var(--rs);cursor:pointer;white-space:nowrap;flex-shrink:0}
.pwa-dismiss{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
/* fixed bills */
.bill-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;position:relative}
.bill-item.overdue{border-color:var(--red)}
.bill-item.paid{opacity:.55}
.bill-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .15s}
.bill-check.done{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.bill-check.overdue{border-color:var(--red)}
.bill-info{flex:1;min-width:0}
.bill-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bill-due{font-family:var(--fm)}
.bill-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--red-dim);color:var(--red)}
.bill-tag.ok{background:var(--green-dim);color:var(--green)}
.bill-tag.soon{background:var(--amber-dim);color:var(--amber)}
.bill-amt{font-size:15px;font-weight:700;font-family:var(--fm);color:var(--red);flex-shrink:0}
.bill-del{position:absolute;right:0;top:0;bottom:0;width:0;background:var(--red-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:width .2s;overflow:hidden;font-size:18px;border-left:1px solid var(--border);border-radius:0 var(--r) var(--r) 0}
.bill-item:hover .bill-del{width:44px}
.summary-bar{display:flex;gap:8px;padding:0 20px 16px}
.sbar{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;text-align:center}
.sbar-val{font-size:17px;font-weight:700;font-family:var(--fm)}
.sbar-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
</style>
</head>

<!-- PWA: inject manifest inline as blob URL -->
<script>
(function(){
  var manifest = {
    name: 'Controle Financeiro',
    short_name: 'Financeiro',
    description: 'Controle suas finan\u00e7as pessoais',
    start_url: './',
    display: 'standalone',
    background_color: '#0d0d0d',
    theme_color: '#0d0d0d',
    orientation: 'portrait',
    icons: [
      {src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="32" fill="%230d0d0d"/><text x="96" y="130" font-size="110" text-anchor="middle">💰</text></svg>', sizes:'192x192', type:'image/svg+xml'},
      {src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="80" fill="%230d0d0d"/><text x="256" y="360" font-size="300" text-anchor="middle">💰</text></svg>', sizes:'512x512', type:'image/svg+xml', purpose:'any maskable'}
    ]
  };
  var blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);

  /* Service worker — cache-first for offline use */
  if ('serviceWorker' in navigator) {
    var swCode = [
      "var CACHE='fin-v1';",
      "var URLS=['/'];",
      "self.addEventListener('install',function(e){",
      "  e.waitUntil(caches.open(CACHE).then(function(c){return c.addAll(URLS);}));",
      "  self.skipWaiting();",
      "});",
      "self.addEventListener('activate',function(e){",
      "  e.waitUntil(caches.keys().then(function(keys){",
      "    return Promise.all(keys.filter(function(k){return k!==CACHE;}).map(function(k){return caches.delete(k);}));",
      "  }));",
      "  self.clients.claim();",
      "});",
      "self.addEventListener('fetch',function(e){",
      "  if(e.request.method!=='GET')return;",
      "  e.respondWith(caches.match(e.request).then(function(cached){",
      "    var fresh=fetch(e.request).then(function(r){",
      "      if(r&&r.status===200){var c=r.clone();caches.open(CACHE).then(function(ca){ca.put(e.request,c);});}",
      "      return r;",
      "    });",
      "    return cached||fresh;",
      "  }));",
      "});"
    ].join('\n');
    var swBlob = new Blob([swCode], {type:'text/javascript'});
    var swUrl  = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(function(){});
  }
})();
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
'use strict';
const {useState, useCallback, useRef, useEffect} = React;
const E = React.createElement;

/* capture the beforeinstallprompt event globally */
var _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', function(ev) {
  ev.preventDefault();
  _pwaPrompt = ev;
});

const PIN_KEY  = 'fin_pin';
const SES_KEY  = 'fin_ses';
const CATS_IN  = ['Salário','Freelance','Investimentos','Presente','Outros'];
const CATS_EX  = ['Alimentação','Transporte','Moradia','Saúde','Lazer','Roupas','Educação','Assinaturas','Cartão','Outros'];
const EMOJIS   = {
  'Alimentação':'🍔','Transporte':'🚌','Moradia':'🏠','Saúde':'💊',
  'Lazer':'🎮','Roupas':'👕','Educação':'📚','Assinaturas':'📱',
  'Cartão':'💳','Salário':'💰','Freelance':'💻','Investimentos':'📈',
  'Presente':'🎁','Outros':'📦'
};

function fmt(v) {
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
}
function fmtShort(v) {
  const abs = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (abs >= 1000) return sign + 'R$' + (abs / 1000).toFixed(1) + 'k';
  return fmt(v);
}
function hashPin(pin) {
  let h = 0;
  for (let i = 0; i < pin.length; i++) { h = ((h << 5) - h) + pin.charCodeAt(i); h |= 0; }
  return h.toString(36);
}
function weekBounds(offset) {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - dow + offset * 7);
  mon.setHours(0,0,0,0);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  sun.setHours(23,59,59,999);
  const f = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return {mon, sun, label: f(mon) + ' \u2013 ' + f(sun)};
}
function useLS(key, def) {
  const [val, setVal] = useState(function() {
    try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : def; }
    catch(ex) { return def; }
  });
  const set = useCallback(function(updater) {
    setVal(function(prev) {
      var next = typeof updater === 'function' ? updater(prev) : updater;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch(ex) {}
      return next;
    });
  }, [key]);
  return [val, set];
}

/* Toast */
function Toast(props) {
  return E('div', {className: 'toast' + (props.show ? '' : ' off')}, props.msg);
}

/* PIN Screen */
function PinScreen(props) {
  var storedHash = useRef(localStorage.getItem(PIN_KEY)).current;
  var isSetup = !storedHash;
  var stageState = useState(isSetup ? 'set' : 'enter');
  var stage = stageState[0]; var setStage = stageState[1];
  var pinState = useState('');
  var pin = pinState[0]; var setPin = pinState[1];
  var firstState = useState('');
  var firstPin = firstState[0]; var setFirst = firstState[1];
  var errState = useState('');
  var errMsg = errState[0]; var setErrMsg = errState[1];
  var shakeState = useState(false);
  var shake = shakeState[0]; var setShake = shakeState[1];

  function doShake(msg) {
    setErrMsg(msg); setShake(true); setPin('');
    setTimeout(function() { setShake(false); }, 500);
  }
  function handle(full) {
    if (stage === 'set') {
      setFirst(full); setPin(''); setStage('confirm'); setErrMsg('');
    } else if (stage === 'confirm') {
      if (full === firstPin) {
        localStorage.setItem(PIN_KEY, hashPin(full));
        sessionStorage.setItem(SES_KEY, '1');
        props.onUnlock();
      } else {
        doShake('PINs diferentes. Tente novamente.');
        setStage('set'); setFirst('');
      }
    } else {
      if (hashPin(full) === storedHash) {
        sessionStorage.setItem(SES_KEY, '1');
        props.onUnlock();
      } else {
        doShake('PIN incorreto');
      }
    }
  }

function isoDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthBounds(offset) {
  var now = new Date();
  var y = now.getFullYear(); var m = now.getMonth() + offset;
  while (m < 0)  { m += 12; y--; }
  while (m > 11) { m -= 12; y++; }
  var first = new Date(y, m, 1, 0, 0, 0, 0);
  var last  = new Date(y, m+1, 0, 23, 59, 59, 999);
  var lbl   = first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return {first:first, last:last, label:lbl.charAt(0).toUpperCase()+lbl.slice(1), y:y, m:m};
}

/* Build full installment timeline from a base transaction.
   Returns array of virtual tx objects, one per remaining parcela. */
function expandInstallments(txs) {
  var rows = [];
  var now  = new Date();

  txs.forEach(function(t) {
    if (!t.installment) {
      rows.push({tx:t, isFuture:false, instLabel:null});
      return;
    }
    var base    = new Date(t.date);
    var total   = t.installment.total;
    var paid    = t.installment.paid;   // which parcel was registered (1-based)
    var remaining = total - paid + 1;   // parcels from this one onwards

    for (var i = 0; i < remaining; i++) {
      var parcelNum = paid + i;
      var d = new Date(base.getFullYear(), base.getMonth() + i, base.getDate());
      var isFuture = d > now;
      rows.push({
        tx: Object.assign({}, t, {
          _virtId: t.id + '_' + parcelNum,
          date: d.toISOString()
        }),
        isFuture: isFuture,
        instLabel: parcelNum + '/' + total,
        isFirst: i === 0
      });
    }
  });

  return rows.sort(function(a,b){ return new Date(b.tx.date) - new Date(a.tx.date); });
}

      all.map(function(r){

    var csv  = csvRows.map(function(r){return r.map(function(v){return '"'+v+'"';}).join(';');}).join('\n');
    var blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});

    a.href=url; a.download='financeiro.csv'; a.click();

          f==='all'?'Tudo':f==='income'?'Receitas':'Despesas'
        );
      })
    ),
    E('div', {className:'sec', style:{marginTop:'12px'}},
      rows.length === 0
        ? E('div',{className:'empty'}, E('div',{className:'empty-ico'},'\uD83D\uDCCB'), E('div',{className:'empty-txt'},'Nenhuma transa\u00e7\u00e3o'))
        : groups.map(function(g) {

                    E('div',{className:'tx-desc'}, t.desc),
                    E('div',{style:{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap',marginTop:'3px'}},
                      E('span',{className:'tx-cat', style:{marginTop:0}}, t.cat),
                      r.instLabel && E('span',{className:'inst-tag'+(r.isFuture?'':' paid')},
                        (r.isFuture?'\uD83D\uDD52':'\u2713') + ' ' + r.instLabel
                      )
                    )
                  ),
                  E('div',{className:'tx-amt '+cls}, (t.type==='income'?'+':'\u2212')+fmt(t.amount)),
                  /* only show delete on the original (first/only) entry */
                  (!r.instLabel || r.isFirst) &&
                    E('div',{className:'tx-del', onClick:function(){delTx(t.id);}}, '\uD83D\uDDD1')
                );
              })
            );
          })
    )
  );
}

/* ── Bills ── */
function AddBillModal(props) {
  var nameS  = useState('');      var name   = nameS[0];   var setName   = nameS[1];
  var amtS   = useState('');      var amount = amtS[0];    var setAmount = amtS[1];
  var catS   = useState('Moradia'); var cat  = catS[0];    var setCat    = catS[1];
  var fixedS = useState(true);    var fixed  = fixedS[0];  var setFixed  = fixedS[1];
  var dayS   = useState('');      var day    = dayS[0];    var setDay    = dayS[1];
  var cardS  = useState('');      var cardId = cardS[0];   var setCardId = cardS[1];

  function submit() {
    var v = parseFloat(amount.replace(',','.'));
    if (!name.trim() || isNaN(v) || v <= 0) return;
    if (fixed && (!day || +day < 1 || +day > 31)) return;
    props.onSave({
      id: Date.now(),
      name: name.trim(),
      amount: v,
      cat: cat,
      fixed: fixed,
      day: fixed ? +day : null,
      cardId: cardId || null,
      payments: {}   /* key: "YYYY-MM" -> {paid, date} */
    });
    props.onClose();
  }
  function stopProp(ev){ ev.stopPropagation(); }

  return E('div',{className:'ov',onClick:props.onClose},
    E('div',{className:'modal',onClick:stopProp},
      E('div',{className:'modal-title'}, props.editing ? 'Editar Conta' : 'Nova Conta Fixa'),
      E('div',{className:'fg'},
        E('label',{className:'fl'},'Nome da conta'),
        E('input',{className:'fi',placeholder:'Ex: Aluguel, Netflix, Luz\u2026',value:name,onChange:function(ev){setName(ev.target.value);}})
      ),
      E('div',{className:'frow'},
        E('div',{className:'fg'},
          E('label',{className:'fl'},'Valor (R$)'),
          E('input',{className:'fi',type:'number',inputMode:'decimal',placeholder:'0,00',value:amount,onChange:function(ev){setAmount(ev.target.value);}})
        ),
        E('div',{className:'fg'},
          E('label',{className:'fl'},'Categoria'),
          E('select',{className:'fi',value:cat,onChange:function(ev){setCat(ev.target.value);}},
            CATS_EX.map(function(c){return E('option',{key:c,value:c},c);})
          )
        )
      ),
      E('label',{className:'inst-toggle'},
        E('input',{type:'checkbox',checked:fixed,onChange:function(ev){setFixed(ev.target.checked);}}),
        E('span',null,'Vencimento fixo todo m\u00eas')
      ),
      fixed && E('div',{className:'fg'},
        E('label',{className:'fl'},'Dia do vencimento'),
        E('input',{className:'fi',type:'number',inputMode:'numeric',placeholder:'Ex: 10',min:'1',max:'31',value:day,onChange:function(ev){setDay(ev.target.value);}})
      ),
      props.cards && props.cards.length > 0 &&
        E('div',{className:'fg'},
          E('label',{className:'fl'},'Cart\u00e3o (opcional)'),
          E('select',{className:'fi',value:cardId,onChange:function(ev){setCardId(ev.target.value);}},
            E('option',{value:''},'Sem cart\u00e3o'),
            props.cards.map(function(c){return E('option',{key:c.id,value:String(c.id)},c.name);})
          )
        ),
      E('button',{className:'sbtn',onClick:submit},'Salvar'),
      E('button',{className:'cbtn',onClick:props.onClose},'Cancelar')
    )
  );
}

function BillsTab(props) {
  var modalS  = useState(false); var showModal = modalS[0]; var setShowModal = modalS[1];
  var monthOS = useState(0);     var mOff = monthOS[0];     var setMOff = monthOS[1];

  var mb  = monthBounds(mOff);
  var now = new Date();
  var mk  = mb.first.getFullYear()+'-'+String(mb.first.getMonth()+1).padStart(2,'0');

  function isPaid(bill) {
    return !!(bill.payments && bill.payments[mk] && bill.payments[mk].paid);
  }
  function getDueDate(bill) {
    if (!bill.fixed || !bill.day) return null;
    var d = new Date(mb.first.getFullYear(), mb.first.getMonth(), bill.day);
    return d;
  }
  function getDueLabel(bill) {
    if (!bill.fixed) return 'Vencimento vari\u00e1vel';
    var d = getDueDate(bill);
    if (!d) return '';
    return 'Vence dia ' + bill.day;
  }
  function getStatus(bill) {
    if (isPaid(bill)) return 'ok';
    if (!bill.fixed) return 'pending';
    var d = getDueDate(bill);
    if (!d) return 'pending';
    var today = new Date(); today.setHours(0,0,0,0);
    var due = new Date(d); due.setHours(0,0,0,0);
    var diff = Math.round((due-today)/(1000*60*60*24));
    if (diff < 0)  return 'overdue';
    if (diff <= 5) return 'soon';
    return 'pending';
  }

  function togglePaid(bill) {
    var wasPaid = isPaid(bill);
    props.setBills(function(bs) {
      return bs.map(function(b) {
        if (b.id !== bill.id) return b;
        var payments = Object.assign({}, b.payments || {});
        if (wasPaid) {
          delete payments[mk];
          /* remove auto-tx if it was created */
          if (payments[mk+'_txid']) {
            var txid = payments[mk+'_txid'];
            props.setTxs(function(ts){return ts.filter(function(t){return t.id!==txid;});});
            delete payments[mk+'_txid'];
          }
        } else {
          var txid2 = Date.now();
          payments[mk] = {paid:true, date:new Date().toISOString(), txid:txid2};
          /* auto-create transaction */
          props.setTxs(function(ts){
            return ts.concat([{
              id: txid2,
              type: 'expense',
              desc: b.name,
              amount: b.amount,
              cat: b.cat,
              cardId: b.cardId||null,
              date: new Date().toISOString(),
              fromBill: b.id
            }]);
          });
          props.showToast(b.name+' marcada como paga \u2705');
        }
        return Object.assign({}, b, {payments: payments});
      });
    });
  }

  function delBill(id) {
    props.setBills(function(bs){return bs.filter(function(b){return b.id!==id;});});
    props.showToast('Conta removida');
  }

  var bills = props.bills;
  var totalDue  = bills.reduce(function(s,b){return s+b.amount;},0);
  var totalPaid = bills.filter(isPaid).reduce(function(s,b){return s+b.amount;},0);
  var totalLeft = totalDue - totalPaid;

  /* sort: overdue first, then by due day, then alphabetical */
  var sorted = bills.slice().sort(function(a,b) {
    var sa = getStatus(a); var sb = getStatus(b);
    var order = {overdue:0,soon:1,pending:2,ok:3};
    if (order[sa] !== order[sb]) return order[sa]-order[sb];
    if (a.day && b.day) return a.day-b.day;
    return a.name.localeCompare(b.name);
  });

  return E('div',null,
    E('div',{className:'hd'},
      E('div',{className:'hd-row'},
        E('div',{className:'wnav'},
          E('button',{className:'wbtn',onClick:function(){setMOff(function(o){return o-1;});}},'\u2039'),
          E('span',{className:'wlabel'},mb.label),
          E('button',{className:'wbtn',disabled:mOff>=0,onClick:function(){setMOff(function(o){return Math.min(0,o+1);});}},'\u203a')
        ),
        E('button',{className:'actbtn',onClick:function(){setShowModal(true);}},'+  Adicionar')
      )
    ),
    E('div',{style:{height:'14px'}}),
    bills.length > 0 && E('div',{className:'summary-bar'},
      E('div',{className:'sbar'},
        E('div',{className:'sbar-val',style:{color:'var(--red)'}},fmtShort(totalLeft)),
        E('div',{className:'sbar-lbl'},'A pagar')
      ),
      E('div',{className:'sbar'},
        E('div',{className:'sbar-val',style:{color:'var(--green)'}},fmtShort(totalPaid)),
        E('div',{className:'sbar-lbl'},'Pago')
      ),
      E('div',{className:'sbar'},
        E('div',{className:'sbar-val'},bills.filter(isPaid).length+'/'+bills.length),
        E('div',{className:'sbar-lbl'},'Contas')
      )
    ),
    E('div',{className:'sec'},
      sorted.length===0
        ? E('div',{className:'empty'},E('div',{className:'empty-ico'},'\uD83D\uDCCB'),E('div',{className:'empty-txt'},'Cadastre suas contas fixas mensais'))
        : sorted.map(function(bill) {
            var paid   = isPaid(bill);
            var status = getStatus(bill);
            var tagTxt = status==='overdue'?'Vencida':status==='soon'?'Vence em breve':paid?'Paga':'Pendente';
            var tagCls = paid?'ok':status==='soon'?'soon':'';
            return E('div',{key:bill.id, className:'bill-item'+(paid?' paid':'')+(status==='overdue'&&!paid?' overdue':'')},
              E('button',{
                className:'bill-check'+(paid?' done':status==='overdue'?' overdue':''),
                onClick:function(){togglePaid(bill);}
              }, paid?'\u2713':''),
              E('div',{className:'bill-info'},
                E('div',{className:'bill-name'},bill.name),
                E('div',{className:'bill-meta'},
                  E('span',{className:'bill-due'},getDueLabel(bill)),
                  E('span',{className:'bill-tag'+' '+tagCls},tagTxt)
                )
              ),
              E('div',{className:'bill-amt'},'\u2212'+fmt(bill.amount)),
              E('div',{className:'bill-del',onClick:function(){delBill(bill.id);}},'\uD83D\uDDD1')
            );
          })
    ),
    showModal && E(AddBillModal,{
      onClose:function(){setShowModal(false);},
      cards:props.cards,
      onSave:function(b){props.setBills(function(bs){return bs.concat([b]);});props.showToast('Conta adicionada!');}
    })
  );
}

/* PWA Install Banner */
function PwaBanner(props) {
  return E('div', {className:'pwa-banner'},
    E('div', null, '\uD83D\uDCF1'),
    E('div', {className:'pwa-banner-txt'},
      E('div', {className:'pwa-banner-title'}, 'Instalar o app'),
      E('div', {className:'pwa-banner-sub'}, 'Acesse direto da tela inicial, sem navegador')
    ),
    E('button', {className:'pwa-install-btn', onClick:props.onInstall}, 'Instalar'),
    E('button', {className:'pwa-dismiss', onClick:props.onDismiss, title:'Fechar'}, '\u00d7')
  );
}

function MainApp() {
  var txsS    = useLS('fin_txs',   []); var txs    = txsS[0]; var setTxs    = txsS[1];
  var goalsS  = useLS('fin_goals', []); var goals  = goalsS[0]; var setGoals  = goalsS[1];
  var billsS  = useLS('fin_bills', []); var bills  = billsS[0]; var setBills  = billsS[1];
  var cardsS  = useLS('fin_cards', []); var cards  = cardsS[0];
  var tabS    = useState('home');       var tab    = tabS[0]; var setTab    = tabS[1];
  var addS    = useState(false);        var addMod = addS[0]; var setAddMod = addS[1];
  var toastS  = useState({msg:'',show:false}); var toast = toastS[0]; var setToast = toastS[1];
  var pwaS    = useState(false);        var showPwa = pwaS[0]; var setShowPwa = pwaS[1];
  var pwaDismS= useState(false);        var pwaDism = pwaDismS[0]; var setPwaDism = pwaDismS[1];

  useEffect(function() {
    /* show banner after 3s if prompt is available and not dismissed */
    var timer = setTimeout(function() {
      if (_pwaPrompt && !pwaDism && !localStorage.getItem('pwa-dismissed')) {
        setShowPwa(true);
      }
    }, 3000);
    var handler = function() {
      if (_pwaPrompt && !localStorage.getItem('pwa-dismissed')) setShowPwa(true);
    };
    window.addEventListener('beforeinstallprompt', handler);
    return function() { clearTimeout(timer); window.removeEventListener('beforeinstallprompt', handler); };
  }, []);

  function installPwa() {
    if (!_pwaPrompt) return;
    _pwaPrompt.prompt();
    _pwaPrompt.userChoice.then(function(r) {
      if (r.outcome === 'accepted') { setShowPwa(false); _pwaPrompt = null; }
    });
  }
  function dismissPwa() {
    setShowPwa(false); setPwaDism(true);
    localStorage.setItem('pwa-dismissed', '1');
  }

  function showToast(msg) {
    setToast({msg:msg,show:true});
    setTimeout(function(){setToast(function(t){return Object.assign({},t,{show:false});});}, 2200);
  }
  function saveTx(tx) {
    setTxs(function(ts){return ts.concat([tx]);});
    showToast(tx.type==='income' ? 'Receita adicionada! \uD83D\uDC9A' : 'Despesa registrada!');
  }

  var TABS = [
    {id:'home',    icon:'\uD83C\uDFE0', label:'In\u00edcio'},
    {id:'bills',   icon:'\uD83D\uDCCB', label:'Contas'},
    {id:'goals',   icon:'\uD83C\uDFAF', label:'Metas'},
    {id:'history', icon:'\uD83D\uDD0D', label:'Hist\u00f3rico'},
  ];

  var showFab = tab === 'home' || tab === 'history';

  return E('div', {className:'app'},
    E('div', {className:'scroll'},
      tab==='home'    && E(HomeTab,    {txs:txs}),
      tab==='bills'   && E(BillsTab,   {bills:bills, setBills:setBills, setTxs:setTxs, cards:cards, showToast:showToast}),
      tab==='goals'   && E(GoalsTab,   {goals:goals, setGoals:setGoals, showToast:showToast}),
      tab==='history' && E(HistoryTab, {txs:txs, setTxs:setTxs, showToast:showToast}),
      showPwa && E(PwaBanner, {onInstall:installPwa, onDismiss:dismissPwa})
    ),
    showFab && E('button', {className:'fab', onClick:function(){setAddMod(true);}}, '+'),
    E('nav', {className:'bnav'},
      TABS.map(function(t) {
        return E('button',{key:t.id, className:'nb'+(tab===t.id?' on':''), onClick:function(){setTab(t.id);}},
          E('span',{className:'ni'},t.icon),
          t.label
        );
      })
    ),
    addMod && E(AddTxModal, {onClose:function(){setAddMod(false);}, onSave:saveTx, cards:cards}),
    E(Toast, {msg:toast.msg, show:toast.show})
  );
}

/* Root — PIN gate, then MainApp */
function App() {
  var unlS = useState(function(){return !!sessionStorage.getItem(SES_KEY);});
  var unlocked = unlS[0]; var setUnlocked = unlS[1];
  if (!unlocked) return E(PinScreen, {onUnlock:function(){setUnlocked(true);}});
  return E(MainApp, null);
}

ReactDOM.createRoot(document.getElementById('root')).render(E(App, null));
